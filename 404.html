<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Flames n Spirits</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0D0D0D;
            color: #F5EDD6;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        ::selection { background: #C9A84C; color: #0D0D0D; }
        .glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .card {
            max-width: 500px;
            background: rgba(26,26,26,0.85);
            border: 1px solid rgba(201,168,76,0.2);
            border-radius: 20px;
            padding: 56px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }
        .logo {
            width: 80px; height: 80px;
            object-fit: contain;
            margin: 0 auto 20px;
        }
        .num {
            font-family: var(--font-accent, 'Cormorant Garamond', serif);
            font-size: 72px;
            color: #C9A84C;
            line-height: 1;
            font-style: italic;
            margin-bottom: 8px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 16px;
            color: #F5EDD6;
        }
        p {
            font-size: 14px;
            color: rgba(245,237,214,0.5);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: #C9A84C;
            color: #0D0D0D;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #F5EDD6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="card">
        <img src="images/logo.svg" alt="Flames n Spirits" class="logo">
        <div class="num">404</div>
        <h1>Lost in the Shadows</h1>
        <p>The page you are searching for does not exist in our sanctuary. Allow us to guide you back.</p>
        <a href="index.html" class="btn">Return to Sanctuary →</a>
    </div>
</body>
</html>
